<!DOCTYPE html>

<html>
    <head>
        <title>Strong, Emphasis dan Blockquote</title>
    </head>
    <body>
        <!-- Strong <strong>-->
            <p><strong>Perhatian:</strong>indonesia emas itu waduk anjing.</p>
        
        <!-- Emphasis <em>-->
            <p><em>Oleh karena itu belajar yang banyak supaya bisa hidup enak</em></p>

        <!-- Blockquote <blockquote>-->
            <blockquote>siapapun presidennya kita cari kerja masih sendiri</blockquote>
            
        <!-- quote <q>-->
            <p><q>Teruslah berkarya sampai hinaan menjadi penganiyaan</q></p>

    </body>
</html>
