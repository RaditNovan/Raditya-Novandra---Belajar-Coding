<!DOCTYPE html>

<html>
    <head>
        <title>Tabel</title>
    </head>
    <body>
        <h1>Membuat Tabel</h1>
        <h4>Tabel Standard</h4>
            <table border="1">
            <!-- tr, baris -->
            <!-- td, data -->
            <!-- th, header -->
             <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
             </tr>
             <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
             </tr>
            </table>

             <h4>Dengan Header</h4>
             <table border="1">
            <tr>
                <th>Senin</th>
                <td>10.00</td>
                <td>11.00</td>
                <td>12.00</td>
            </tr>
            <tr>
                <th>Selasa</th>
                <td>09.00</td>
                <td>11.00</td>
                <td>13.00</td>
            </tr>
            </table>
            <br>
            <table border="1">
                <th>Senin</th>
                <th>Selasa</th>
                <tr>
                    <td>10.00</td>
                    <td>11.00</td>
                </tr>
            </table>
            <br>
            <table border="1">
                <th></th>
                <th>Senin</th>
                <th>Selasa</th>
                <tr>
                    <th>10.00</th>
                    <td colspan="2">ngopi di warung</td>
                </tr>
                <tr>
                    <th>11.00</th>
                    <td colspan="2">ngopi di warung lagi</td>
                </tr>
                <tr>
                    <th rowspan="2">12.00</th>
                    <td>ngopi di warung lagi dan lagi</td>
                    <td>Ke Gereja</td>
                </tr>
                <tr>
                    <td></td>
                    <td>ngopi lagi</td>
                </tr>
                
            </table>
    </body>
</html>
